name: trading-bot

# Every 30 minutes. Five instruments take ~20-25 s per run; GitHub bills a
# minimum of 1 minute, so ~1,440 minutes/month, inside the 2,000 free minutes
# for a private repo.
#
# Trigger: cron-job.org (same PAT pattern as the marketing-bot jobs, see
# BOT-OPS.md row I) calls workflow_dispatch at :07 and :37. The overnight
# flatten window is 20:00-21:00 UTC (cutoff to swap charge), so at least one
# poll must land inside it; the pinger guarantees that.
on:
  # Triggered every 30 minutes at :07 and :37 by cron-job.org calling the
  # workflow_dispatch API. GitHub's own `schedule` was removed on 9 Sep 2026:
  # it fired only sporadically, and when it did it landed within a minute of
  # the pinger, and the two logins together drew a 429 from capital.com.
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Send one test email instead of evaluating the market"
        type: boolean
        default: false
      backtest:
        description: "Re-score the rule on the broker's candles instead of trading"
        type: boolean
        default: false
      accounts:
        description: "List the accounts on this login and their balances, then stop"
        type: boolean
        default: false

concurrency:
  # Never let a delayed run overlap the next one - two bots trading the same
  # account would each think they were the only position holder.
  group: trading-bot
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write     # the analyst's report is committed back to the repo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet requests anthropic

      # The daily-loss limit needs to remember today's starting balance across
      # runs. Each Actions run is a fresh container, so state.json is carried
      # in the cache. Unique key + restore-keys = "always save the newest".
      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Send test email
        if: ${{ inputs.test_mail }}
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_RECIPIENTS: ${{ vars.ALERT_RECIPIENTS }}
        run: python notify.py --test

      # Read-only: logs in, lists the accounts, exits. No arming secret, so
      # the client cannot place an order even if something below changed.
      # Deliberately ahead of the rule tests and outside their gate -- when the
      # bot is reading the wrong account, finding out which one is the whole
      # job, and a failing test must not stand in the way of that.
      - name: List accounts
        if: ${{ inputs.accounts }}
        env:
          CAPITAL_ENV: live
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_ACCOUNT_ID: ${{ secrets.CAPITAL_ACCOUNT_ID }}
        run: python bot.py --accounts

      # A one-seconds-long proof that the live rule and the backtested rule are
      # still the same rule, plus the brakes and the watchdog. Hermetic: no
      # credentials, no network, no clock -- it cannot fail because the broker
      # is down. checks.yml runs the same suite on every push, so drift is
      # normally caught before it ever reaches this workflow.
      #
      # This step GATES trading, deliberately: a rule that no longer matches
      # the one the backtest scored should not be placing live orders. The cost
      # of that choice is that a failure here also skips the overnight and
      # weekend flatten, so a position could sit through a weekend -- the
      # watchdog reports exactly that on the next pass, and open positions keep
      # their broker-side stop and target throughout.
      - name: Rule tests
        if: ${{ !inputs.test_mail && !inputs.accounts }}
        run: python -m unittest discover -s tests

      - name: Evaluate
        if: ${{ !inputs.test_mail && !inputs.backtest && !inputs.accounts }}
        env:
          CAPITAL_ENV: live
          # Arming is a secret you set yourself, exactly like uncommenting the
          # line in .env. Without it the client refuses to place live orders.
          CAPITAL_I_UNDERSTAND_THIS_IS_REAL_MONEY: ${{ secrets.CAPITAL_I_UNDERSTAND_THIS_IS_REAL_MONEY }}

          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}

          # Which account to trade. Unset, the bot takes whichever one the API
          # lists first -- and on 1 Oct 2026 that silently became a different,
          # empty account, so it read a balance of zero for two days while the
          # money sat in the other one. `--accounts` prints the ids.
          CAPITAL_ACCOUNT_ID: ${{ secrets.CAPITAL_ACCOUNT_ID }}

          # Toggle without editing code: Settings -> Secrets and variables ->
          # Actions -> Variables. Defaults to a dry run if unset.
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}

          # Comma-separated. Each instrument's stop and RSI band live in
          # bot.INSTRUMENTS; anything not listed there uses the fallbacks below.
          CAPITAL_EPICS: ${{ vars.CAPITAL_EPICS || 'EURUSD,GBPUSD,AUDUSD' }}
          # 4-hour candles: a 30-minute poll sees every candle at least eight
          # times, whereas 5-minute signals came and went between polls. It is
          # also the only resolution the broker gives 166 days of history for,
          # which is what backtest.py was run on.
          CAPITAL_RESOLUTION: HOUR_4

          # Email alerts. Same mailbox and app password as marketing-bot.
          # If these are unset the bot still trades, just silently.
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_RECIPIENTS: ${{ vars.ALERT_RECIPIENTS }}

          # Daily analyst (analyst.py). Unset = the analyst quietly skips.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REGIME_ADX_MAX: "25"
          TREND_MODE: "invert"

          # With five instruments the 3% daily halt (three stopped trades) is
          # the brake that keeps "more trades" from becoming "more losses in
          # one day". Do not loosen it to get more activity.
          RISK_PER_TRADE_PCT: "1.0"
          DAILY_LOSS_LIMIT_PCT: "3.0"
          # One position per instrument, three across the account. Margin per
          # position is a few dollars; the account was $127.27 with $123.46
          # available on 28 Sep 2026, so the cap is set by correlation risk
          # (MAX_SAME_USD_SIDE below), not by margin.
          MAX_CONCURRENT_POSITIONS: "3"
          REWARD_TO_RISK: "1.5"

          # Fallbacks for instruments not in bot.INSTRUMENTS.
          STOP_DISTANCE_PCT: "1.0"
          RSI_PERIOD: "14"
          RSI_OVERSOLD: "30"
          RSI_OVERBOUGHT: "70"

          SESSION_CUTOFF_UTC: "20:00"
          NO_NEW_TRADES_MINS_BEFORE_CUTOFF: "60"
          OVERNIGHT_HOLD_MIN_SIZE: "0"
          # Hold positions the broker PAYS you to carry; flatten the ones you pay for.
          HOLD_PAID_OVERNIGHT: "true"
          OVERNIGHT_MAX_PAY_PCT: "0.02"
          WEEKEND_FLATTEN: "true"
          COOLDOWN_MINUTES: "240"
          MAX_SAME_USD_SIDE: "2"
          NEWS_FILTER: "true"
          NEWS_BLACKOUT_MINUTES: "30"
          # 20, not 60: v1 reached -7.3R in 22 trades, so a 60-trade gate is
          # ~10 weeks at this trade rate before the brake may even fire.
          KILL_AFTER_TRADES: "20"
          KILL_BELOW_R: "-5"
          # Short-window brake, and the only one that clears itself: -4R inside
          # any 5 days stops new entries until those trades age out.
          ROLLING_LOSS_R: "-4"
          ROLLING_LOSS_DAYS: "5"
          # A pass every 30 min is normal; past 40 means the pinger missed one
          # and the market went unwatched. Logged and emailed, never a veto.
          MAX_PASS_GAP_MINUTES: "40"
        run: |
          python bot.py --once
          # The analyst writes reports/YYYY-MM-DD.md once a day after 21:00
          # UTC. It can never fail the trading job. It no longer needs
          # ANTHROPIC_API_KEY: without one it writes the day's facts from the
          # broker's own numbers and skips only the narrative.
          python analyst.py --if-due || echo "analyst failed (non-fatal)"

      # Re-score the rule on the broker's own candles. Lives here because this
      # is where the Capital.com credentials are; it places no orders (nothing
      # arms it) and never runs in the same pass as a trade.
      - name: Backtest
        if: ${{ inputs.backtest }}
        env:
          CAPITAL_ENV: live
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          REGIME_ADX_MAX: "25"
          TREND_MODE: "invert"
        run: |
          set -o pipefail
          # One invocation for all three pairs: --epic takes a comma-separated
          # list and logs in once. Three separate logins drew a 429 from
          # capital.com before (see the 3b0780d commit).
          #
          # No --regime / --trend / --filters: those print comparison sweeps of
          # other parameter sets, and picking the best row out of a sweep is how
          # a backtest gets fitted to its own history. This scores the LIVE rule
          # as configured, which is the only number that predicts anything.
          python backtest.py --epic EURUSD,GBPUSD,AUDUSD \
            --resolution HOUR_4 --count 1000 --reward-to-risk 1.5 \
            2>&1 | tee backtest-output.txt

      - name: Upload the backtest
        if: ${{ inputs.backtest }}
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_id }}
          path: backtest-output.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Commit the analyst's report
        if: ${{ !inputs.test_mail && !inputs.backtest && !inputs.accounts }}
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain reports)" ]; then
            git config user.name "trading-bot"
            git config user.email "trading-bot@users.noreply.github.com"
            git add reports
            git commit -q -m "Analyst report $(date -u +%F)"
            git push -q
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_id }}
          path: bot.log
          retention-days: 7
          if-no-files-found: ignore
