name: trading-bot

# Every 30 minutes. Five instruments take ~20-25 s per run; GitHub bills a
# minimum of 1 minute, so ~1,440 minutes/month, inside the 2,000 free minutes
# for a private repo.
#
# Trigger: cron-job.org (same PAT pattern as the marketing-bot jobs, see
# BOT-OPS.md row I) calls workflow_dispatch at :07 and :37. The overnight
# flatten window is 20:00-21:00 UTC (cutoff to swap charge), so at least one
# poll must land inside it; the pinger guarantees that.
on:
  # Triggered every 30 minutes at :07 and :37 by cron-job.org calling the
  # workflow_dispatch API. GitHub's own `schedule` was removed on 9 Sep 2026:
  # it fired only sporadically, and when it did it landed within a minute of
  # the pinger, and the two logins together drew a 429 from capital.com.
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Send one test email instead of evaluating the market"
        type: boolean
        default: false

concurrency:
  # Never let a delayed run overlap the next one - two bots trading the same
  # account would each think they were the only position holder.
  group: trading-bot
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet requests

      # The daily-loss limit needs to remember today's starting balance across
      # runs. Each Actions run is a fresh container, so state.json is carried
      # in the cache. Unique key + restore-keys = "always save the newest".
      - name: Restore bot state
        uses: actions/cache@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Send test email
        if: ${{ inputs.test_mail }}
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_RECIPIENTS: ${{ vars.ALERT_RECIPIENTS }}
        run: python notify.py --test

      - name: Evaluate
        if: ${{ !inputs.test_mail }}
        env:
          CAPITAL_ENV: live
          # Arming is a secret you set yourself, exactly like uncommenting the
          # line in .env. Without it the client refuses to place live orders.
          CAPITAL_I_UNDERSTAND_THIS_IS_REAL_MONEY: ${{ secrets.CAPITAL_I_UNDERSTAND_THIS_IS_REAL_MONEY }}

          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}

          # Toggle without editing code: Settings -> Secrets and variables ->
          # Actions -> Variables. Defaults to a dry run if unset.
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}

          # Comma-separated. Each instrument's stop and RSI band live in
          # bot.INSTRUMENTS; anything not listed there uses the fallbacks below.
          CAPITAL_EPICS: ${{ vars.CAPITAL_EPICS || 'EURUSD,GBPUSD,AUDUSD' }}
          # 4-hour candles: a 30-minute poll sees every candle at least eight
          # times, whereas 5-minute signals came and went between polls. It is
          # also the only resolution the broker gives 166 days of history for,
          # which is what backtest.py was run on.
          CAPITAL_RESOLUTION: HOUR_4

          # Email alerts. Same mailbox and app password as marketing-bot.
          # If these are unset the bot still trades, just silently.
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_RECIPIENTS: ${{ vars.ALERT_RECIPIENTS }}

          # With five instruments the 3% daily halt (three stopped trades) is
          # the brake that keeps "more trades" from becoming "more losses in
          # one day". Do not loosen it to get more activity.
          RISK_PER_TRADE_PCT: "1.0"
          DAILY_LOSS_LIMIT_PCT: "3.0"
          # One position per instrument, three across the account. Three
          # minimum positions need ~$12 margin of the $36.67 balance.
          MAX_CONCURRENT_POSITIONS: "3"
          REWARD_TO_RISK: "1.5"

          # Fallbacks for instruments not in bot.INSTRUMENTS.
          STOP_DISTANCE_PCT: "1.0"
          RSI_PERIOD: "14"
          RSI_OVERSOLD: "30"
          RSI_OVERBOUGHT: "70"

          SESSION_CUTOFF_UTC: "20:00"
          NO_NEW_TRADES_MINS_BEFORE_CUTOFF: "60"
          OVERNIGHT_HOLD_MIN_SIZE: "0"
          # Hold positions the broker PAYS you to carry; flatten the ones you pay for.
          HOLD_PAID_OVERNIGHT: "true"
          OVERNIGHT_MAX_PAY_PCT: "0.02"
          WEEKEND_FLATTEN: "true"
          COOLDOWN_MINUTES: "240"
          MAX_SAME_USD_SIDE: "2"
          NEWS_FILTER: "true"
          NEWS_BLACKOUT_MINUTES: "30"
          KILL_AFTER_TRADES: "60"
          KILL_BELOW_R: "-5"
        run: python bot.py --once

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_id }}
          path: bot.log
          retention-days: 7
          if-no-files-found: ignore
